name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Firebase config (when configured)
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_BASE64" ]; then
            printf "%s" "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::error::FIREBASE_CONFIG_BASE64 secret is missing"
            exit 1
          fi
      - name: Restore stable Android signing key
        env:
          OURCAFE_KEYSTORE_BASE64: ${{ secrets.OURCAFE_KEYSTORE_BASE64 }}
          OURCAFE_KEYSTORE_PASSWORD: ${{ secrets.OURCAFE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$OURCAFE_KEYSTORE_BASE64" ] && [ -n "$OURCAFE_KEYSTORE_PASSWORD" ]; then
            printf "%s" "$OURCAFE_KEYSTORE_BASE64" | base64 --decode > app/ourcafe-signing.jks
          else
            echo "::error::Stable signing secrets are missing"
            exit 1
          fi
      - name: Verify Android signing fingerprint
        run: keytool -list -v -keystore app/ourcafe-signing.jks -storepass "$OURCAFE_KEYSTORE_PASSWORD" -alias ourcafe | grep SHA1
        env:
          OURCAFE_KEYSTORE_PASSWORD: ${{ secrets.OURCAFE_KEYSTORE_PASSWORD }}
      - name: Build debug APK
        env:
          OURCAFE_KEYSTORE_PASSWORD: ${{ secrets.OURCAFE_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OurCafe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
